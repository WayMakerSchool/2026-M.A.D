<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoMate</title>
    <script type="module" crossorigin src="./assets/index-DF11T7pu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-x6PLsn2B.css">
    <!-- ShoMate Toss-tone theme: 폰트 → 테마 순서. 되돌리려면 아래 두 줄 삭제 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="./toss-theme.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./model-selector.js"></script>
    <script>
      // 오버레이(iframe) 모드: 패널 안에서 시작한 드래그가 쇼핑몰 페이지 텍스트 선택으로 새지 않게
      // 마우스 누름/뗌을 content-script 에 알린다. 사이드패널 모드(부모 없음)에서는 아무것도 안 함.
      if (window.parent !== window) {
        const tell = (type) => { try { window.parent.postMessage({ type }, '*'); } catch (_) {} };
        window.addEventListener('mousedown', () => tell('shomate-drag-start'), true);
        window.addEventListener('mouseup', () => tell('shomate-drag-end'), true);
        window.addEventListener('blur', () => tell('shomate-drag-end'));
      }
    </script>
  </body>
</html>
